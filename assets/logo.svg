<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" fill="#0d0f14"/>
  
  <!-- Outer concentric ring 1 - thick, cropped slightly at bottom right -->
  <path d="M 128 28 A 100 100 0 1 1 127.9 28" fill="none" stroke="#e8ecf2" stroke-width="3" opacity="0.15"/>
  
  <!-- Outer concentric ring 2 -->
  <path d="M 128 50 A 78 78 0 1 1 127.9 50" fill="none" stroke="#e8ecf2" stroke-width="4" opacity="0.3"/>
  
  <!-- Concentric ring 3 - the main eye boundary, slightly offset -->
  <path d="M 128 72 A 56 56 0 1 1 127.9 72" fill="none" stroke="#e8ecf2" stroke-width="5" opacity="0.7"/>
  
  <!-- Eye shape - sharp almond with asymmetrical points -->
  <path d="M 40 128 Q 84 78 140 82 Q 200 86 218 128 Q 200 170 140 174 Q 84 178 40 128 Z" fill="none" stroke="#e8ecf2" stroke-width="4" stroke-linejoin="miter"/>
  
  <!-- Inner iris ring -->
  <path d="M 104 128 A 36 36 0 1 1 103.9 128" fill="none" stroke="#39ff88" stroke-width="2" opacity="0.6"/>
  
  <!-- Iris filled disc -->
  <path d="M 128 98 A 30 30 0 1 1 127.9 98" fill="#0d0f14" stroke="#39ff88" stroke-width="2.5"/>
  
  <!-- Play button pupil - sharp triangle, slightly off-center and rotated -->
  <polygon points="116,108 148,128 116,148" fill="#ff3b30" stroke="#ff3b30" stroke-width="1" stroke-linejoin="miter"/>
  
  <!-- Accent glint on play button -->
  <polygon points="122,114 132,128 122,142" fill="#e8ecf2" opacity="0.25"/>
  
  <!-- Sharp focal mark: diagonal slash through outer rings top-right -->
  <path d="M 208 52 L 236 36" stroke="#ff3b30" stroke-width="5" stroke-linecap="square"/>
  <path d="M 214 62 L 242 46" stroke="#ff3b30" stroke-width="3" stroke-linecap="square" opacity="0.6"/>
  
  <!-- Small accent dots along the eye corners -->
  <circle cx="44" cy="126" r="2.5" fill="#39ff88"/>
  <circle cx="214" cy="130" r="2.5" fill="#39ff88"/>
  
  <!-- Subtle scan lines crossing the eye - illicit surveillance vibe -->
  <path d="M 60 110 L 200 110" stroke="#39ff88" stroke-width="1" opacity="0.12"/>
  <path d="M 56 128 L 208 128" stroke="#39ff88" stroke-width="1" opacity="0.12"/>
  <path d="M 60 146 L 200 146" stroke="#39ff88" stroke-width="1" opacity="0.12"/>
  
  <!-- Small wordmark bottom -->
  <text x="128" y="238" font-family="monospace" font-size="11" fill="#e8ecf2" text-anchor="middle" letter-spacing="4" opacity="0.5">YT-VIEW-BOT</text>
</svg>
